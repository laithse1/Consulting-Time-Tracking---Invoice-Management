name: Verify application

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Package frontend with backend and run backend checks
        run: |
          mkdir -p backend/src/main/resources/static
          cp -R frontend/dist/. backend/src/main/resources/static/
          mvn -B -f backend/pom.xml verify
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Verify manual financial workflow
        run: npm run e2e:smoke
        working-directory: frontend
        env:
          E2E_BROWSER_CHANNEL: bundled
      - name: Verify assistant workflow with disposable SQLite
        env:
          APP_TOKEN: e2e-isolated-test-token-not-a-real-secret
          APP_PORT: 18082
          DB_PATH: ${{ runner.temp }}/assistant-ci.db
          APP_ALLOWED_ORIGINS: https://example.test
          E2E_BROWSER_CHANNEL: bundled
        run: |
          java -jar backend/target/invoice-manager-1.0.0.jar > "${RUNNER_TEMP}/assistant.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          cd frontend
          npm run e2e:assistant
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: verification-diagnostics
          path: |
            backend/target/surefire-reports/
            tmp/e2e-server.log
