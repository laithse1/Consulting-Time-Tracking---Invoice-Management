services:
  app:
    build:
      context: .
      args:
        VITE_APP_TITLE: ${VITE_APP_TITLE:-Consulting Invoice Manager}
        VITE_WORKSPACE_LABEL: ${VITE_WORKSPACE_LABEL:-Independent consulting}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
        VITE_ASSISTANT_AUTOSAVE_MS: ${VITE_ASSISTANT_AUTOSAVE_MS:-600}
        VITE_TIMER_TICK_MS: ${VITE_TIMER_TICK_MS:-1000}
        VITE_NOTICE_DURATION_MS: ${VITE_NOTICE_DURATION_MS:-5000}
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      APP_TOKEN: ${APP_TOKEN:?Set APP_TOKEN in .env to at least 24 random characters}
      BIND_ADDRESS: 0.0.0.0
      DB_PATH: /app/data/consulting.db
      ASSISTANT_PROVIDER_CONFIG: /app/config/assistant-providers.json
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-}
      INVOICE_NUMBER_PREFIX: ${INVOICE_NUMBER_PREFIX:-LA}
      ASSISTANT_MAX_SOURCE_CHARACTERS: ${ASSISTANT_MAX_SOURCE_CHARACTERS:-10000}
      ASSISTANT_MAX_ACTIONS: ${ASSISTANT_MAX_ACTIONS:-30}
      ASSISTANT_HISTORY_LIMIT: ${ASSISTANT_HISTORY_LIMIT:-50}
      ASSISTANT_MAX_REVISIONS: ${ASSISTANT_MAX_REVISIONS:-30}
      AI_CONNECT_TIMEOUT: ${AI_CONNECT_TIMEOUT:-8s}
      AI_REQUEST_TIMEOUT: ${AI_REQUEST_TIMEOUT:-35s}
      AI_RESPONSE_TIMEOUT: ${AI_RESPONSE_TIMEOUT:-20s}
      AI_MAX_RESPONSE_BYTES: ${AI_MAX_RESPONSE_BYTES:-1048576}
      AI_MAX_CONFIG_BYTES: ${AI_MAX_CONFIG_BYTES:-262144}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-true}
      TZ: America/Chicago
    volumes:
      - ${DATA_DIR:-./data}:/app/data
      - ./config:/app/config:ro
    restart: unless-stopped
    read_only: true
    tmpfs:
      # SQLite JDBC extracts a native library here and needs executable mappings.
      - /tmp:rw,exec,nosuid,nodev,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
