services:
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      APP_TOKEN: ${APP_TOKEN:?Set APP_TOKEN in .env to at least 24 random characters}
      BIND_ADDRESS: 0.0.0.0
      DB_PATH: /app/data/consulting.db
      TZ: America/Chicago
    volumes:
      - consulting-data:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      # SQLite JDBC extracts a native library here and needs executable mappings.
      - /tmp:rw,exec,nosuid,nodev,size=128m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  consulting-data:
